name: release-build
# Manual job: promotes the v7 candidates, runs the full build and freeze on GitHub, and pushes the result to a new branch.
# Nothing is tagged or merged here; review the branch, open a PR, merge, then tag.
on:
  workflow_dispatch:
    inputs:
      hd: { description: 'IEM HD target (A, B or C)', required: true, default: 'A' }
      version: { description: 'Release version', required: true, default: '7.0.0' }
      keep_v6_structure: { description: 'Protection V6: keep the v5 file structure (true/false)', required: true, default: 'false' }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Promote candidates
        run: |
          FLAG=""; [ "${{ inputs.keep_v6_structure }}" = "true" ] && FLAG="--keep-v6-structure"
          python3 tools/promote_v7.py --hd "${{ inputs.hd }}" --version "${{ inputs.version }}" $FLAG
      - name: Record device reports
        run: |
          python3 tools/record_device.py iem-hd pass "KZ EDX Pro" "Blind A/B/C listening by the author: A (Harman IE 2019) won, balanced and crisper than v6, level matched, no distortion or fatigue. B was bass heavy and the most fatiguing; C ranked third."
          python3 tools/record_device.py spk-v6 pass "Redmi 12" "Author listening: no clipping or distortion at loud volumes. Reported significantly quieter than v6.1.0, with clearly better punch and sharpness."
      - name: Build with runtime acceptance (slow)
        run: python3 build/build.py
      - name: Docs, site data, ship, freeze
        run: |
          python3 build/docs_site.py
          python3 tools/ship.py
          python3 build/freeze.py
      - name: Checks
        run: python3 tests/check.py
      - name: Push branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ inputs.version }}"
          git add -A; git commit -m "release: v${{ inputs.version }} (HD ${{ inputs.hd }})"
          git push origin "release/v${{ inputs.version }}"
