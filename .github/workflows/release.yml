name: release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version to prepare (must equal VERSION on the selected ref)', required: true }
  push: { tags: ['v*'] }
permissions: { contents: write }
concurrency: { group: 'release-${{ github.ref }}', cancel-in-progress: false }

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VER: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Input must equal VERSION
        run: test "$VER" = "$(cat VERSION)" || { echo "input $VER != VERSION $(cat VERSION)"; exit 1; }
      - name: Build, regenerate, freeze and gate (slow; refuses a FROZEN release)
        run: python3 tools/ship.py --release
      - name: Push release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VER"
          git add -A
          git commit -m "release: v$VER"
          git push origin "release/v$VER"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: pip install -r requirements.txt
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }
      - name: Tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - name: Gate (hashes, reproducible rebuild, stamps, links)
        run: python3 tests/check.py
      - name: Rebuild with full acceptance and require zero failures
        run: python3 build/build.py --out /tmp/rel
      - name: Release must be frozen and match the rebuild
        run: |
          test -f releases/$(cat VERSION)/FROZEN || { echo "run python3 tools/ship.py --release and commit first"; exit 1; }
          diff <(sort releases/$(cat VERSION)/SHA256SUMS.txt) <(sort /tmp/rel/SHA256SUMS.txt)
      - name: Release notes from docs/CHANGELOG.md
        run: |
          python3 - <<'PY'
          import re
          v=open('VERSION').read().strip(); t=open('docs/CHANGELOG.md',encoding='utf-8').read()
          m=re.search(r'^## v'+re.escape(v)+r'\b.*?$(.*?)(?=^## |\Z)',t,re.S|re.M)
          open('/tmp/notes.md','w').write((m.group(1).strip() if m else 'See docs/CHANGELOG.md')+'\n\nVerify: `sha256sum -c SHA256SUMS.txt`. Evidence: docs/EVIDENCE.md.\n')
          PY
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" /tmp/rel/*.zip /tmp/rel/SHA256SUMS.txt /tmp/rel/acceptance.json /tmp/rel/DIFF.md --title "HyperAudio $GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
