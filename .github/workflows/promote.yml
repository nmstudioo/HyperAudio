name: promote-v7
on:
  workflow_dispatch:
    inputs:
      hd:
        description: 'IEM HD Candidate (A, B, or C)'
        required: true
        default: 'A'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy
      - name: Run promotion script
        run: python3 tools/promote_v7.py --hd ${{ github.event.inputs.hd }}
      - name: Run ship pipeline
        run: python3 tools/ship.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v7.0.0 (promoted HD candidate ${{ github.event.inputs.hd }})"
          git push origin main
