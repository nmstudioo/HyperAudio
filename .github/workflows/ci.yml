name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Hashes, rebuild reproducibility, stamps, links, JS syntax
        run: python3 tests/check.py
      - name: Limiter gate policy regression
        run: python3 tests/eel/gate_policy_test.py
      - name: Full build with runtime acceptance (response, EEL parse, limiter, tail, NaN soak) and drift diff
        run: |
          python3 build/docs_site.py
          python3 build/seo.py
          python3 build/build.py --out /tmp/rel
          python3 tests/gate_v7_limiter.py
          cat /tmp/rel/DIFF.md 2>/dev/null || true
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install browser test tools
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8765/
      - name: Layout, links, a11y and page-weight gates
        env: { CI: 'true' }
        run: |
          node tests/overflow.js http://localhost:8765/
          node tests/footer.js http://localhost:8765/
          node tests/links.js http://localhost:8765/
          node tests/a11y.js http://localhost:8765/
          node tests/budget.js http://localhost:8765/
      - name: Lighthouse CI (a11y >= 0.95 is a hard gate)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - uses: actions/upload-artifact@v7
        with: { name: acceptance, path: /tmp/rel/acceptance.json }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: lighthouse, path: lhci-reports, if-no-files-found: ignore }

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v6
      - name: Publish only site content
        run: rm -f site/README.md
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v5
