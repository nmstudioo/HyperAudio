name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build (temp dir) + hash, link, JS and parity checks
        run: python3 tests/check.py
      - name: Layout gate (no horizontal overflow, nav a11y)
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          node tests/overflow.js
      - name: Build current release and fail on drift
        run: |
          python3 build/build.py --out /tmp/rel
          cat /tmp/rel/DIFF.md 2>/dev/null || true
      # EEL compile + limiter tests: enable once tests/eel/ (runtime + harness) is added; see docs/EVIDENCE.md
