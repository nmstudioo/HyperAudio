name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dsp: ${{ steps.s.outputs.dsp }}
      gen: ${{ steps.s.outputs.gen }}
      site: ${{ steps.s.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: s
        run: python3 tools/ci_scope.py
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}

  verify:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: CI scope detection tests
        run: python3 tests/test_ci_scope.py
      - name: Static gate (hashes, stamps, freshness, links, JS syntax; full rebuild only when DSP changed)
        env:
          HA_SKIP_REBUILD: ${{ needs.prep.outputs.dsp == 'true' && '0' || '1' }}
        run: python3 tests/check.py
  dsp:
    needs: prep
    if: needs.prep.outputs.dsp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Limiter gate policy regression
        run: python3 tests/eel/gate_policy_test.py
      - name: Restore runtime acceptance result
        id: acc
        uses: actions/cache@v6
        with:
          path: /tmp/rel
          key: acceptance-v2-${{ hashFiles('src/profiles/**', 'src/profiles.meta.json', 'VERSION', 'releases/**', 'build/build.py', 'build/response.py', 'build/verify.py', 'build/derive_stats.py', 'tests/eel/**', 'requirements.txt') }}
      - name: Full build with runtime acceptance and drift diff
        if: steps.acc.outputs.cache-hit != 'true'
        run: python3 build/build.py --out /tmp/rel
      - name: Validate acceptance result (fresh or restored from cache)
        run: python3 tests/check_acceptance.py /tmp/rel/acceptance.json
      - name: NextGEN IRS builder
        run: python3 build/generator/build_irs_nextgen.py

      - name: Upload NextGEN IRS artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextgen-irs
          path: build/generator/out/iem_nextgen/
          if-no-files-found: error

      - name: Generator reproduction vs releases/5.0.0 (informational)
        if: needs.prep.outputs.gen == 'true'
        continue-on-error: true
        run: python3 tests/gen_repro.py
      - name: Drift report
        run: cat /tmp/rel/DIFF.md 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with: { name: acceptance, path: /tmp/rel/acceptance.json, if-no-files-found: ignore }

  browser:
    needs: prep
    if: needs.prep.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('.github/workflows/ci.yml', 'package-lock.json') }}
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Publish downloads from releases/
        run: python3 build/build.py --publish
      - name: Serve site
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8765/
      - name: Layout, footer, a11y, page-weight and behaviour gates (chromium + webkit)
        env: { CI: 'true' }
        run: |
          node tests/overflow.js http://localhost:8765/
          node tests/footer.js http://localhost:8765/
          node tests/a11y.js http://localhost:8765/
          node tests/budget.js http://localhost:8765/
          node tests/ui-behavior.js http://localhost:8765/
      - name: Screenshots
        if: always()
        run: node tests/screenshots.js http://localhost:8765/ shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    needs: prep
    if: github.event_name == 'pull_request' && needs.prep.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    env: { SHOT_WIDTHS: '360,1280' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m venv ~/v && ~/v/bin/pip install -q pillow
      - name: Resolve main SHA
        id: m
        run: echo "sha=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache main screenshots
        id: bc
        uses: actions/cache@v6
        with:
          path: shots_base
          key: shots-base-${{ steps.m.outputs.sha }}-360-1280-${{ hashFiles('tests/shots_all.js') }}
      - name: Screenshot main
        if: steps.bc.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch main "https://github.com/${{ github.repository }}.git" _base
          (cd _base && python3 build/build.py --publish)
          python3 -m http.server 8766 --directory _base/site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8766/
          node tests/shots_all.js http://localhost:8766/ shots_base
      - name: Screenshot PR
        run: |
          python3 build/build.py --publish
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8765/
          node tests/shots_all.js http://localhost:8765/ shots_pr
      - name: Diff
        run: |
          ~/v/bin/python tests/visual_diff.py shots_base shots_pr shots_diff 0.02 || true
          { echo '### Visual diff vs main'; echo '```'; tail -40 shots_diff/report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diff
          path: |
            shots_diff/
            shots_pr/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [prep, verify, dsp, browser]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - name: Publish downloads from releases/
        run: python3 build/build.py --publish
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v5
