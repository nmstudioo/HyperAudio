name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dsp: ${{ steps.s.outputs.dsp }}
      gen: ${{ steps.s.outputs.gen }}
      site: ${{ steps.s.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: s
        run: python3 tools/ci_scope.py
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}

  verify:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Static gate (hashes, stamps, freshness, links, JS syntax; full rebuild only when DSP changed)
        env:
          HA_SKIP_REBUILD: ${{ needs.prep.outputs.dsp == 'true' && '0' || '1' }}
        run: python3 tests/check.py
  dsp:
    needs: prep
    if: needs.prep.outputs.dsp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Limiter gate policy regression
        run: python3 tests/eel/gate_policy_test.py
      - name: Restore runtime acceptance result
        id: acc
        uses: actions/cache@v6
        with:
          path: /tmp/rel
          key: acceptance-v1-${{ hashFiles('src/profiles/**', 'src/profiles.meta.json', 'VERSION', 'releases/**', 'build/build.py', 'build/response.py', 'build/verify.py', 'tests/eel/**', 'requirements.txt') }}
      - name: Full build with runtime acceptance and drift diff
        if: steps.acc.outputs.cache-hit != 'true'
        run: python3 build/build.py --out /tmp/rel
      - name: Generator reproduction vs releases/5.0.0 (informational)
        if: needs.prep.outputs.gen == 'true'
        continue-on-error: true
        run: python3 tests/gen_repro.py
      - name: Drift report
        run: cat /tmp/rel/DIFF.md 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with: { name: acceptance, path: /tmp/rel/acceptance.json, if-no-files-found: ignore }

  browser:
    needs: prep
    if: needs.prep.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Publish downloads from releases/
        run: python3 build/build.py --publish
      - name: Serve site
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8765/
      - name: Layout, footer, a11y, page-weight and behaviour gates (chromium + webkit)
        env: { CI: 'true' }
        run: |
          node tests/overflow.js http://localhost:8765/
          node tests/footer.js http://localhost:8765/
          node tests/a11y.js http://localhost:8765/
          node tests/budget.js http://localhost:8765/
          node tests/ui-behavior.js http://localhost:8765/
      - name: Screenshots
        if: always()
        run: node tests/screenshots.js http://localhost:8765/ shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [prep, verify, dsp, browser]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - name: Publish downloads from releases/
        run: python3 build/build.py --publish
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v5
