name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip, npm and Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: deps-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy
      - name: Hashes, rebuild reproducibility, links, JS syntax
        run: python3 tests/check.py
      - name: Full build with runtime acceptance (response, EEL parse, limiter, tail, NaN soak) and drift diff
        run: |
          python3 build/docs_site.py
          python3 build/seo.py
          python3 build/build.py --out /tmp/rel
          cat /tmp/rel/DIFF.md 2>/dev/null || true
      - name: Layout gate (no horizontal overflow, nav a11y)
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          sleep 2
          npm install playwright axe-core
          npx playwright install --with-deps chromium
          node tests/overflow.js http://localhost:8765/
          node tests/footer.js http://localhost:8765/
          node tests/links.js http://localhost:8765/
          node tests/a11y.js http://localhost:8765/
          node tests/budget.js http://localhost:8765/
      - name: Lighthouse CI (a11y >= 0.95 is a hard gate)
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          sleep 2
          npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - uses: actions/upload-artifact@v4
        with: { name: acceptance, path: /tmp/rel/acceptance.json }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: lhci-reports, if-no-files-found: ignore }

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
