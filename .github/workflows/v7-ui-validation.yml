name: v7-ui-validation
on:
  workflow_dispatch:
  push:
    branches: ["ui/v7-*", "ui-v7-*", "feat/v7-ui*"]
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "build/seo.py"
      - "tests/ui-v7-contract.js"
      - "tests/ui-behavior.js"
      - ".github/workflows/v7-ui-validation.yml"
permissions:
  contents: read
concurrency:
  group: v7-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Static, release-integrity and UI contract checks
        run: |
          python3 -m py_compile build/seo.py
          python3 tests/check.py
          node tests/ui-v7-contract.js
          node tests/links.js
          for file in site/assets/js/*.js; do node --check "$file"; done
      - name: Install browser test tools
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium webkit
      - name: Serve website
        run: |
          python3 -m http.server 8765 --directory site >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:8765/
      - name: Responsive, footer, accessibility and budget checks
        env:
          CI: 'true'
        run: |
          node tests/overflow.js http://localhost:8765/
          node tests/footer.js http://localhost:8765/
          node tests/a11y.js http://localhost:8765/
          node tests/budget.js http://localhost:8765/
          node tests/ui-behavior.js http://localhost:8765/
          node tests/screenshots.js http://localhost:8765/ shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build source ZIP
        if: success()
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=HyperAudio-v7-ui/ HEAD -o dist/HyperAudio-v7-ui-source.zip
          sha256sum dist/HyperAudio-v7-ui-source.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: HyperAudio-v7-ui-source
          path: dist/
          retention-days: 30
